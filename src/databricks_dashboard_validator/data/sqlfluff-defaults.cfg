# Default sqlfluff configuration for SQL extracted from a Lakeview dashboard.
#
# This is only used when the repository being checked does not provide its own
# `.sqlfluff`. It is deliberately syntax first rather than style first: dashboard SQL is
# edited through the Databricks UI as often as it is edited by hand, so a hook that fails
# a commit over indentation is a hook that gets disabled. See the README for how to turn
# the full sqlfluff rule set back on.
[sqlfluff]
dialect = databricks

# layout                    whitespace and indentation, which the Databricks editor owns
# references.from           false positives on struct access, e.g. `t.details.job.id`
# references.qualification  unqualified column names are idiomatic in dashboard queries
# structure.column_order    pure style
exclude_rules = layout, references.from, references.qualification, structure.column_order

max_line_length = 120
