name: pre-commit CI

on:  # yamllint disable-line rule:truthy
  pull_request:
  push:
    branches: [main]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    # The dogfooding hook runs the validator directly instead of through docker, so the
    # tools it shells out to have to be on the PATH.
    - name: Install sqlfluff
      run: pip install sqlfluff==4.3.0
    - uses: pre-commit/action@v3.0.1
