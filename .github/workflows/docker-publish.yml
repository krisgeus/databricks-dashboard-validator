name: Docker Build Dashboard SQL Checker CI

on:  # yamllint disable-line rule:truthy
  pull_request:
  push:
    branches: [main]
    tags:
  release:
    types: [published]

env:
  DOCKER_IMAGE: ghcr.io/${{ github.repository_owner }}/databricks-dashboard-sql-check

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          # Load into the local daemon so the unit tests can run against the image
          load: true
          tags: ${{ env.DOCKER_IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.clone_url }}
            org.opencontainers.image.revision=${{ github.sha }}
          platforms: linux/amd64

      - name: Run unit tests
        run: |
          docker run --rm \
            --volume "${{ github.workspace }}/tests:/tests:ro" \
            --volume "${{ github.workspace }}/examples:/examples:ro" \
            --env DASHBOARD_SQL_REQUIRE_ALL=1 \
            --entrypoint /tests/run-tests.sh \
            ${{ env.DOCKER_IMAGE }}:latest

      - name: Log in to GitHub Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push latest image
        # Build and push because of multi platform build
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.DOCKER_IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.clone_url }}
            org.opencontainers.image.revision=${{ github.sha }}
          platforms: linux/amd64,linux/arm64

      - name: Push release image
        # Build and push because of multi platform build
        if: startsWith(github.event.release.tag_name, 'v')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.DOCKER_IMAGE }}:${{ github.event.release.tag_name }}
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.clone_url }}
            org.opencontainers.image.revision=${{ github.sha }}
          platforms: linux/amd64,linux/arm64
