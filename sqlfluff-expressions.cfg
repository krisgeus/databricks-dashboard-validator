# sqlfluff configuration for widget field expressions.
#
# A field expression is a SQL fragment such as `COUNT(`update_id`)` that the Databricks
# UI generates and rewrites whenever a visualisation is edited. Style rules have nothing
# to say about it, so every rule is switched off and only the parser runs. Unparsable
# input is still reported as a PRS violation, which is the whole point of the check.
[sqlfluff]
dialect = databricks
exclude_rules = all
